spring:
  autoconfigure:
    exclude: []
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:sse_compare}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:sse}
    password: ${DB_PASS:ssepass}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 10
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
