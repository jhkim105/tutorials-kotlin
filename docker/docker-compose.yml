name: tutorials-infra

# ==============================================================================
# 기본 표준 인프라 (단독 Standalone 환경)
# ==============================================================================
include:
  - path: mysql/docker-compose.yml
  - path: postgresql/docker-compose.yml
  - path: redis/docker-compose.yml
  - path: kafka/docker-compose.yml
  - path: mongodb/docker-compose.yml
  - path: clickhouse/docker-compose.yml
  - path: monitoring/docker-compose.yml

# ==============================================================================
# 특수 클러스터/복제 환경 (필요 시 주석을 해제하거나 해당 디렉토리에서 단독 실행)
