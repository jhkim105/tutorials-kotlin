spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false

datasource:
  master:
    url: jdbc:h2:mem:master_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    maximum-pool-size: 15
    minimum-idle: 2
    pool-name: HikariPool-Master
  slaves:
    slave1:
      url: jdbc:h2:mem:slave1_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
      username: sa
      password: ""
      driver-class-name: org.h2.Driver
      maximum-pool-size: 15
      minimum-idle: 2
      pool-name: HikariPool-Slave1
    slave2:
      url: jdbc:h2:mem:slave2_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
      username: sa
      password: ""
      driver-class-name: org.h2.Driver
      maximum-pool-size: 15
      minimum-idle: 2
      pool-name: HikariPool-Slave2

logging:
  level:
    jhkim105.tutorials.routing: DEBUG
    org.springframework.jdbc.datasource: INFO
    org.springframework.transaction: INFO
